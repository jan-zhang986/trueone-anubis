id: "wf-checkout-reconcile-e2e"
name: "端到端秒杀下单与资金对账全链路流"
description: "网关接口下单 -> 数据库资产余额核销 -> 质量准出门禁裁决"
priority: "P0"
module: "全链路E2E"
tags:
  - "e2e"
  - "workflow"
  - "order"
  - "reconciliation"

params:
  userId: "USR-998811"
  skuId: "SKU-554422"
  orderAmount: 199.00

nodes:
  - id: "step-1-create-order"
    name: "模拟用户网关秒杀下单"
    type: "HTTP"
    config:
      method: "POST"
      url: "/api/v1/order/create"
      headers:
        Authorization: "Bearer mock-token-2026"
      body:
        userId: "{{ params.userId }}"
        skuId: "{{ params.skuId }}"
        amount: "{{ params.orderAmount }}"

  - id: "step-2-query-ledger"
    name: "校验数据库 trade_ledger 借贷平衡"
    type: "SQL"
    dependsOn:
      - "step-1-create-order"
    config:
      sql: |
        SELECT balance, frozen_amount, debit_amount, credit_amount 
        FROM trade_ledger 
        WHERE user_id = '{{ params.userId }}'
        ORDER BY id DESC LIMIT 1;

  - id: "step-3-quality-gate"
    name: "全链路资金安全质量门禁判定"
    type: "QUALITY_GATE"
    dependsOn:
      - "step-2-query-ledger"
    config:
      rule: "ZERO_CAPITAL_LOSS"
      threshold: 100
# Last verified via TrueOne Web Online Editor
